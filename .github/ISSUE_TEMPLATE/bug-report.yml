name: Bug Report
description: Report a problem with Encore Karaoke
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below as completely as you can. It helps us reproduce and fix the issue faster.

  - type: dropdown
    id: channel
    attributes:
      label: Release Channel
      description: Select the release channel you're on. Found in the bottom right of the screen.
      options:
        - Beta
        - Stable/Release
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Encore Version
      description: Also found in bottom right of the screen.
      placeholder: "e.g. 1.10.0, Virgo 1.10.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug
      placeholder: Tell us what went wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step, so we can reproduce it on our end
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware specifications
      description: CPU, RAM, & GPU
      placeholder: "e.g. Intel Celeron N4000, 4GB RAM, Intel UHD Graphics"

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error messages or logs. Logs are usually found in the app's log folder — this will be auto-formatted as code.
      render: shell

  - type: textarea
    id: media-info
    attributes:
      label: File / track info (if relevant)
      description: If the bug relates to a specific song, please share the song you're pertaining to.

  - type: checkboxes
    id: offline
    attributes:
      label: Context
      options:
        - label: This occurred while offline (no internet connection)
        - label: This occurred during a live event/performance
        - label: I've checked existing issues and this hasn't been reported yet

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or anything else that might help
