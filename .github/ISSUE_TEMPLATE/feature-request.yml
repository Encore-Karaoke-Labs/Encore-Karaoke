name: Feature Request
description: Suggest an idea or improvement for Encore
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea! The more context you give, the easier it is for us to evaluate and prioritize.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap, frustration, or limitation you're running into
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're currently using, or other approaches you thought about

  - type: dropdown
    id: area
    attributes:
      label: Which part of Encore does this affect?
      options:
        - Playback
        - Rendering
        - Recording
        - Duets
        - Scoring
        - UI / UX
        - Other / not sure
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints to keep in mind
      options:
        - label: This should work on low-spec hardware (e.g. the Intel Celeron)
        - label: I've checked existing issues/discussions and this hasn't been suggested yet

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, references from other karaoke software/hardware, screenshots, or anything else that helps explain the idea
