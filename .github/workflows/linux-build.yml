name: Build Linux Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: secrets
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare keyring
        run: |
          pacman-key --init
          pacman --noconfirm -Sy archlinux-keyring

      - name: Install build dependencies
        run: |
          pacman --noconfirm -Syyu
          pacman --noconfirm -S git nodejs npm dpkg fakeroot 7zip

      - name: Show build info
        run: |
          echo "Building Commit: ${{ github.sha }}"
          echo "Node Version: $(node -v)"
          echo "App Version: $(node -p "require('./package.json').version")"

      - name: Install node dependencies
        run: |
          npm i
          # Explicitly install esbuild to avoid conflicts
          npm install --save-dev esbuild@0.28.0

      - name: Build binaries
        run: |
          npm run make 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed!"
            cat build.log
            exit 1
          fi

      - name: Verify build output
        run: |
          echo "Checking for build output..."
          ls -la ./out/
          if [ ! -d "./out/Encore Karaoke-linux-x64" ]; then
            echo "ERROR: Expected output directory not found!"
            find ./out -type d
            exit 1
          fi

      - name: Package binaries
        run: |
          cd "./out/Encore Karaoke-linux-x64"
          7z a encore-karaoke-linux-x64.zip

      - name: Upload Build artifacts ( Linux Debian )
        uses: actions/upload-artifact@v4.6.2
        with:
          name: encore-linux-debian
          path: ./out/make/deb/x64/*.deb

      - name: Upload Build artifacts ( Linux Generic )
        uses: actions/upload-artifact@v4.6.2
        with:
          name: encore-linux-zip
          path: "./out/Encore Karaoke-linux-x64/encore-karaoke-linux-x64.zip"
