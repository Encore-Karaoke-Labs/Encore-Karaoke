<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Encore Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="view-container">
        <!-- Left: Control Remote -->
        <div id="remote-view" class="view">
          <div id="remote-view-content">
            <div class="remote-title-desktop">ENCORE</div>

            <div class="remote-grid">
              <!-- Song Number Input Display -->
              <div class="input-display span-4">
                <span class="input-display-label">SONG</span>
                <span class="input-display-digits" id="input-buffer"
                  >------</span
                >
              </div>

              <!-- Primary Action Row -->
              <button data-type="stop" data-value="Escape" class="btn-danger">
                STOP
              </button>
              <button
                data-type="play_pause"
                id="btn-play-pause"
                class="btn-secondary"
              >
                PAUSE
              </button>
              <button
                data-type="reserve"
                data-value="Enter"
                class="btn-primary span-2"
              >
                RESERVE
              </button>

              <!-- Numpad Grid -->
              <div class="numpad-grid span-4">
                <button class="numpad-btn" data-type="digit" data-value="1">
                  1
                </button>
                <button class="numpad-btn" data-type="digit" data-value="2">
                  2
                </button>
                <button class="numpad-btn" data-type="digit" data-value="3">
                  3
                </button>
                <button class="numpad-btn" data-type="digit" data-value="4">
                  4
                </button>
                <button class="numpad-btn" data-type="digit" data-value="5">
                  5
                </button>
                <button class="numpad-btn" data-type="digit" data-value="6">
                  6
                </button>
                <button class="numpad-btn" data-type="digit" data-value="7">
                  7
                </button>
                <button class="numpad-btn" data-type="digit" data-value="8">
                  8
                </button>
                <button class="numpad-btn" data-type="digit" data-value="9">
                  9
                </button>
                <button
                  class="numpad-btn"
                  data-type="backspace"
                  data-value="Backspace"
                >
                  &larr;
                </button>
                <button class="numpad-btn" data-type="digit" data-value="0">
                  0
                </button>
                <button
                  class="numpad-btn"
                  data-type="toggle_recording"
                  style="
                    color: #ff5555;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  "
                >
                  <span class="svg-icon icon-record"></span>
                </button>
              </div>

              <!-- Controls: Key & Volume -->
              <div class="controls-wrapper span-4">
                <div class="control-column">
                  <button data-type="key_up" data-value="ArrowUp">
                    KEY &uarr;
                  </button>
                  <button data-type="key_down" data-value="ArrowDown">
                    KEY &darr;
                  </button>
                </div>
                <div class="control-column">
                  <button data-type="vol_up" data-value="=">VOL &uarr;</button>
                  <button data-type="vol_down" data-value="-">
                    VOL &darr;
                  </button>
                </div>
              </div>

              <!-- Playback Features Grid -->
              <div class="playback-features-grid span-4">
                <button class="feature-btn" data-type="toggle_melody">
                  <span class="svg-icon icon-melody"></span>
                  <span>MELODY</span>
                </button>
                <button class="feature-btn" data-type="cycle_rhythm">
                  <span class="svg-icon icon-rhythm"></span>
                  <span>RHYTHM</span>
                </button>
                <button class="feature-btn" data-type="toggle_chorus">
                  <span class="svg-icon icon-chorus"></span>
                  <span>CHORUS</span>
                </button>
                <button class="feature-btn" data-type="toggle_bgv">
                  <span class="svg-icon icon-bgv"></span>
                  <span>BGV</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Songbook & Search View -->
        <div id="songlist-view" class="view">
          <div class="library-header">
            <div class="library-tabs">
              <div class="library-tab active" id="tab-local">SONGBOOK</div>
            </div>
            <div class="search-row">
              <input
                type="text"
                id="library-search"
                class="search-bar"
                placeholder="Search songs or artists..."
                autocomplete="off"
              />
            </div>
          </div>

          <div class="library-content">
            <div
              id="song-view-container"
              style="display: flex; flex-direction: column; height: 100%"
            >
              <div
                id="song-scroller-container"
                class="virtual-scroller"
                style="flex: 1"
              >
                <div class="virtual-scroller-content" id="songs-list"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">Notice</div>

    <script src="control.js"></script>
  </body>
</html>
