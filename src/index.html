<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encore Karaoke Core</title>
    <link
      rel="preload"
      href="assets/img/boot/bg.png"
      as="image"
      type="image/png"
    />
    <link
      rel="preload"
      href="assets/img/boot/booting.svg"
      as="image"
      type="image/svg+xml"
    />
    <link rel="shortcut icon" href="icons/icon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="/libs/meyda.min.js"></script>
    <script defer src="/libs/anime.min.js"></script>
    <script defer src="/libs/aromanize.js"></script>
    <script defer src="/libs/socket.io.min.js"></script>
    <script defer src="/libs/jsmediatags.min.js"></script>
    <script type="module" src="core.js"></script>
    <style id="TEMP_STYLE">
      html {
        background-color: black;
      }
      body {
        width: 100%;
        background-color: black;
        /* background-color: #14141a; */
        opacity: 0;
        transition: opacity 0.75s linear;
      }
    </style>
  </head>
  <body ontouchstart="">
    <div id="loading" class="flex">
      <h1>Loading...</h1>
      <img
        class="loading"
        draggable="false"
        style="width: 3rem; height: 3rem"
        src="assets/img/loading-spinner.svg"
      />
    </div>
  </body>
</html>
